<!-- Why Choose Us - Reusable Partial -->
<section class="bg-slate-900 rounded-3xl p-6 md:p-10 shadow-xl text-white relative overflow-hidden">
    <div class="relative z-10">
        <h2 class="text-2xl md:text-3xl font-extrabold mb-6 md:mb-8 flex items-center gap-3">
            <i data-lucide="award" class="w-8 h-8 text-brand-400"></i> 
            {{ .title }}
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
            {{ range .items }}
            <div class="flex items-start gap-3 md:gap-4 p-4 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm hover:bg-white/10 transition-colors text-left">
                <div class="flex w-12 h-12 rounded-xl bg-gradient-to-br {{ .color }} items-center justify-center flex-shrink-0 shadow-lg">
                    <i data-lucide="{{ .icon }}" class="w-6 h-6 text-white"></i>
                </div>
                <div class="w-full pt-0.5">
                    <h3 class="font-bold text-white text-base md:text-lg leading-tight">{{ .title }}</h3>
                    <p class="text-slate-300 text-sm mt-1">{{ .desc }}</p>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
