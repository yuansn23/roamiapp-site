baseURL = "https://www.roamiapp.com/"
languageCode = "en-us"
title = "Roami"
defaultContentLanguage = "en" 
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
	  
# 1. 定义自定义输出格式
[outputFormats.FaqSitemap]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = false

# 2. 修改你的 outputs 配置（把 section 里的 Sitemap 去掉，保持干净）
[outputs]
  home = ["HTML", "RSS", "Sitemap"]
  page = ["HTML"]
  # 注意：这里不需要写 section = [...] 了，我们在 _index.md 里单独指定


[services]
  [services.googleAnalytics]
    id = 'G-SPQT223N41'

# 英文配置
    [languages.en]
    languageName = "English"
    contentDir = "content/en"  # 告诉 Hugo 英文内容在这个文件夹
    weight = 1
	
 [languages.en.params]
    # 导航栏文案
    nav_links = [
      { name = "Home", url = "/" },
      { name = "Plans", url = "/plans/" },
      { name = "eSIM Compatibility", url = "/compatibility/" },
     { name = "Free eSIM", url = "/free-esim/" },
      { name = "Roami APP", url = "/app/" },
	   { name = "Carriers", url = "/carriers/" },
      { name = "FAQ", url = "/faq/" }
    ]
    

# 页脚文案
    footer_desc = "Providing premium eSIM services in 200+ countries and regions, keeping you connected wherever you travel."
    
    footer_col1_title = "Top Destinations"
    # 优化：将纯文本改为带链接的对象，并使用绝对路径
    footer_col1_links = [
{name="United States eSIM", url="/united-states-esim/"}, 
{name="Europe eSIM", url="/europe-esim/"}, 
{name="Japan eSIM", url="/japan-esim/"}, 
{name="Germany eSIM", url="/germany-esim/"}, 
{name="Turkey eSIM", url="/turkey-esim/"}, 
{name="Canada eSIM", url="/canada-esim/"}
    ]
    
    footer_col2_title = "Customer Support"
    # 优化：前面加 "/"，并建议去掉 .html 使用 Clean URL
    footer_col2_links = [
  { name = "FAQ", url = "/faq/" }, 
  { name = "eSIM Compatibility", url = "/compatibility/" },
   { name = "Carriers", url = "/carriers/" },
     { name = "Download Roami", url = "/app/" }
]
    
    footer_col3_title = "Company Info"
    # 优化：前面加 "/"，确保从任何页面点击都跳回根目录
    footer_col3_links = [
      {name="About Us", url="/about-us/"}, 
	  {name="Free eSIM", url="/free-esim/"}, 
      {name="Privacy Policy", url="/privacy/"}, 
      {name="Terms of Service", url="/terms/"}
    ]
    
    footer_copyright = "© 2026 Roami. All rights reserved."
    footer_slogan = "Professional Global eSIM Service Provider | Global eSIM Data Roaming Expert"

    # 弹窗文案
    modal_title = "Notice"
    modal_cancel = "Cancel"
    modal_confirm = "Go now"
	
