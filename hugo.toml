baseURL = "https://www.roamiapp.com/"
languageCode = "en-us"
title = "Roami"
defaultContentLanguage = "en" 
enableRobotsTXT = true
enableMissingTranslationPlaceholders = true
disableKinds = ["taxonomy", "term"]


[outputFormats.llms]
  baseName = "llms"               # 输出的文件名（不含后缀）
  mediaType = "text/plain"        # 输出的文件类型是纯文本
  isPlainText = true              # 是关键，表示生成纯文本文件
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
	  

# ==========================================
# 输出格式定义（确保 sitemap 为 XML）
# ==========================================
[outputFormats.Sitemap]
  mediaType = "application/xml"
  baseName = "sitemap"
  isPlainText = false
  notAlternative = true

# 全局 outputs（控制各类页面生成的内容）
[outputs]
  home = ["HTML", "RSS", "Sitemap", "llms"]
  page = ["HTML"]
  section = ["HTML", "RSS"]


[services]
  [services.googleAnalytics]
    id = 'G-SPQT223N41'

# 英文配置
    [languages.en]
    languageName = "English"
    contentDir = "content/en"  # 告诉 Hugo 英文内容在这个文件夹
    weight = 1
	
 [languages.en.params]
    # 导航栏文案
    nav_links = [
