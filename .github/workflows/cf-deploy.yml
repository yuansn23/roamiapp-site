name: 定时触发 Cloudflare Pages 部署（含持久化日志）

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 关键：赋予写入仓库的权限
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库（为了能提交日志文件）
        uses: actions/checkout@v4

      - name: 调用部署钩子并生成日志
        id: trigger
        run: |
          TIMESTAMP=$(date "+%Y-%m-%d %H:%M:%S")
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/973ab90c-ed40-47a7-a876-b56fa78b7eb6")
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.result.id // "无"')
          
          # 构造一条日志行
          if [ "$SUCCESS" = "true" ]; then
            LOG_LINE="[$TIMESTAMP] ✅ 成功 | 部署ID: $DEPLOY_ID"
          else
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.errors[0].message // "未知错误"')
            LOG_LINE="[$TIMESTAMP] ❌ 失败 | 错误: $ERROR_MSG"
          fi
          
          echo "$LOG_LINE"
          
          # 追加到日志文件（如果文件不存在则创建）
          echo "$LOG_LINE" >> deploy-log.txt

      - name: 提交日志文件回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy-log.txt
          # 只有文件有变化时才提交（避免空提交）
          git diff --staged --quiet || git commit -m "更新部署日志 [skip ci]"
          git push